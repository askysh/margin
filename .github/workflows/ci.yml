# CI: type-check and build the UI on every push. The Rust side (minutes-core
# with whisper.cpp) needs a macOS runner and a long build, so it runs only in
# the release workflow and locally (see docs/development.md, Testing).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run build
