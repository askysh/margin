# Updates the margin cask in askysh/homebrew-tap when a release is published.
# Runs on publish, not in release.yml: a draft's asset URLs answer 404, so a cask
# merged before publishing would break `brew install`.
#
# The cask is rendered from packaging/homebrew/margin.rb with the sha256 of the
# published DMG (checked against SHA256SUMS first), checked with brew style and
# brew audit, installed and uninstalled, then proposed as a pull request on the
# tap that merges itself once the tap's tests pass.
#
# Needs the HOMEBREW_TAP_TOKEN secret: a fine-grained token with Contents and
# Pull requests write access to askysh/homebrew-tap only. Without it the run
# still checks everything and prints the cask to copy by hand.
name: Homebrew tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Published version (X.Y.Z) to put in the tap"
        required: true

permissions:
  contents: read

concurrency:
  group: homebrew-tap
  cancel-in-progress: false

jobs:
  tap:
    name: Cask for askysh/homebrew-tap
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - id: version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then v="${INPUT_VERSION#v}"; else v="${TAG_NAME#v}"; fi
          case "$v" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$v' is not a version (expected X.Y.Z)"; exit 1 ;;
          esac
          if [ "$PRERELEASE" = "true" ]; then
            echo "::notice title=Prerelease::v$v is a prerelease; the tap keeps the last release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.version.outputs.skip != 'true'
        with:
          ref: v${{ steps.version.outputs.version }}

      - name: Download and check the DMG
        if: steps.version.outputs.skip != 'true'
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dir="$RUNNER_TEMP/release"
          gh release download "v$VERSION" --dir "$dir" --pattern "Margin-${VERSION}.dmg" --pattern SHA256SUMS
          cd "$dir"
          f="Margin-${VERSION}.dmg"
          want="$(awk -v f="$f" '$2 == f || $2 == "*" f {print $1; exit}' SHA256SUMS)"
          have="$(shasum -a 256 "$f" | awk '{print $1}')"
          [ -n "$want" ] && [ "$want" = "$have" ] || { echo "::error::$f does not match SHA256SUMS (${want:-not listed}, file $have)"; exit 1; }
          echo "$f: sha256 $have, matches SHA256SUMS"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Clone the tap and render the cask into it
        if: steps.version.outputs.skip != 'true'
        id: tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          DIR: ${{ steps.files.outputs.dir }}
        run: |
          tap="$(brew --repository)/Library/Taps/askysh/homebrew-tap"
          rm -rf "$tap"
          if [ -n "$TAP_TOKEN" ]; then
            git clone "https://x-access-token:${TAP_TOKEN}@github.com/askysh/homebrew-tap.git" "$tap"
          else
            echo "::warning::HOMEBREW_TAP_TOKEN is not set: checking only, no pull request."
            git clone https://github.com/askysh/homebrew-tap.git "$tap"
          fi
          scripts/homebrew-render.sh --version "$VERSION" --dmg "$DIR/Margin-${VERSION}.dmg" "$tap"
          echo "path=$tap" >> "$GITHUB_OUTPUT"

      - name: brew style, audit, install and uninstall
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          brew style askysh/tap/margin
          brew audit --strict --online --cask askysh/tap/margin
          brew install --cask askysh/tap/margin
          got="$(defaults read /Applications/Margin.app/Contents/Info CFBundleShortVersionString)"
          [ "$got" = "$VERSION" ] || { echo "::error::the cask installed Margin $got, not $VERSION"; exit 1; }
          codesign --verify --deep --strict /Applications/Margin.app
          spctl --assess --type execute /Applications/Margin.app
          brew uninstall --cask askysh/tap/margin

      - name: Open the tap pull request and let it merge itself
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAP: ${{ steps.tap.outputs.path }}
        run: |
          cd "$TAP"
          if [ -z "$GH_TOKEN" ]; then
            echo "::group::Casks/margin.rb"; cat Casks/margin.rb; echo "::endgroup::"
            echo "::notice title=No pull request::Set HOMEBREW_TAP_TOKEN, or copy the cask above into askysh/homebrew-tap."
            exit 0
          fi
          git add Casks/margin.rb
          if git diff --cached --quiet; then
            echo "::notice title=Tap up to date::askysh/homebrew-tap already has margin $VERSION."
            exit 0
          fi
          branch="margin-${VERSION}"
          git checkout -b "$branch"
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -m "margin ${VERSION}"
          git push --force origin "$branch"
          body="margin ${VERSION} from https://github.com/askysh/margin/releases/tag/v${VERSION}, rendered, audited and installed by Margin's homebrew-tap workflow."
          gh pr view "$branch" --repo askysh/homebrew-tap >/dev/null 2>&1 \
            || gh pr create --repo askysh/homebrew-tap --base main --head "$branch" --title "margin ${VERSION}" --body "$body"
          gh pr merge "$branch" --repo askysh/homebrew-tap --auto --squash --delete-branch
          echo "::notice title=Tap pull request::$(gh pr view "$branch" --repo askysh/homebrew-tap --json url --jq .url) merges itself once its checks pass."
