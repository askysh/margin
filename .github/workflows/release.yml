# Release: on a v* tag, build Margin.app on Apple silicon, sign it with the
# Developer ID, notarize and staple it, and attach the zip and DMG to a draft
# GitHub release. scripts/release.sh does the work; this file only sets up
# the keychain and the API key.
#
# Repository secrets (the same values benchbar uses):
#   MACOS_CERTIFICATE_P12       base64 of the Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD  the .p12 password
#   MACOS_SIGN_IDENTITY         "Developer ID Application: Name (TEAMID)"
#   NOTARY_API_KEY_P8           contents of the App Store Connect API key (.p8)
#   NOTARY_API_KEY_ID           the key's ID
#   NOTARY_API_ISSUER_ID        the issuer ID
#   TAURI_SIGNING_PRIVATE_KEY           the in-app updater's private key (~/keys/margin-updater.key)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
#
# The release is a draft. Publishing it makes it "latest", which is when the app's
# updater sees it (it reads releases/latest/download/latest.json) and when
# homebrew-tap.yml updates the cask.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the v (a draft release is created)"
        required: true

permissions:
  contents: write

jobs:
  release:
    # minutes-core uses the macOS 26 Speech APIs, which need Xcode 26 or later.
    runs-on: macos-26
    timeout-minutes: 90
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Version without the v
        run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      # A release built and uploaded by hand (scripts/release.sh) already has its files.
      - name: Skip when the release exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice title=Release exists::v$VERSION already has a release; nothing to build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Use the newest Xcode
        if: steps.exists.outputs.skip != 'true'
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -n 1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - uses: oven-sh/setup-bun@v2
        if: steps.exists.outputs.skip != 'true'

      - name: Rust toolchain
        if: steps.exists.outputs.skip != 'true'
        run: |
          rustup toolchain install stable --profile minimal
          brew list cmake >/dev/null 2>&1 || brew install cmake

      - uses: actions/cache@v4
        if: steps.exists.outputs.skip != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Import the Developer ID certificate
        if: steps.exists.outputs.skip != 'true'
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          # The keychain list is split on purpose: one argument per keychain.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Write the notary and updater keys
        if: steps.exists.outputs.skip != 'true'
        env:
          KEY: ${{ secrets.NOTARY_API_KEY_P8 }}
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/notary.p8"
          printf '%s' "$UPDATER_KEY" > "$RUNNER_TEMP/updater.key"
          printf '%s' "$UPDATER_PASSWORD" > "$RUNNER_TEMP/updater.password"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8"
            echo "MARGIN_UPDATER_KEY_PATH=$RUNNER_TEMP/updater.key"
            echo "MARGIN_UPDATER_KEY_PASSWORD_PATH=$RUNNER_TEMP/updater.password"
          } >> "$GITHUB_ENV"

      - name: Build, sign, notarize, package
        if: steps.exists.outputs.skip != 'true'
        env:
          MARGIN_SIGNING_ENV: /dev/null
          MARGIN_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: scripts/release.sh "$VERSION"

      - name: Draft the GitHub release
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" release/Margin-"$VERSION".dmg release/Margin-"$VERSION".zip \
            release/Margin.app.tar.gz release/Margin.app.tar.gz.sig release/latest.json release/SHA256SUMS \
            --draft --title "Margin $VERSION" --generate-notes --target "$GITHUB_SHA"

      - name: Remove the keys
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/updater.key" "$RUNNER_TEMP/updater.password"
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
