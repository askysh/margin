name: Bug report
description: Something in Margin does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please search the open issues first.
        A security problem goes through a private report instead: see SECURITY.md.
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Apple menu, About This Mac.
      placeholder: macOS 26.1
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Margin version
      description: Settings → Updates shows it.
      placeholder: 0.0.5
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - Homebrew (brew install --cask askysh/tap/margin)
        - The DMG from a release
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Model
      description: Settings shows the model.
      options:
        - Fast
        - Balanced
        - Best
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Recording type
      options:
        - Record call
        - Record in person
        - Not about a recording
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        The last lines of `~/Library/Application Support/Margin/state/logs/margin.log`
        from around the time of the problem. For a problem after Stop, also
        `margin-worker.log` in the same folder. Remove meeting titles, names and other
        text you do not want to share.
      render: text
  - type: checkboxes
    id: ai
    attributes:
      label: Written by you
      options:
        - label: I wrote this report in my own words (CONTRIBUTING.md, AI assisted contributions).
          required: true
