[package]
name = "margin"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Margin: a calm, local-first meeting notepad built on minutes-core"
default-run = "margin"

[[bin]]
name = "margin"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Upstream core, pinned to a tag. Bump with scripts/bump-upstream.sh (re-seeds Cargo.lock).
minutes-core = { git = "https://github.com/silverstein/minutes", tag = "v0.32.1", default-features = false, features = ["whisper", "streaming", "diarize", "metal"] }
# minutes-core asks for ort "2.0.0-rc.10" (caret); later rcs break pyannote-rs. Upstream's CLI pins it too.
ort = { version = "=2.0.0-rc.10", default-features = false }

tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
window-vibrancy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
dirs = "7"
ureq = "3"
which = "8"
regex = "1"
trash = "5"
libc = "0.2"
block2 = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
lto = "thin"
